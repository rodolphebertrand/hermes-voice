# Garde secrets — exécuté à chaque push/PR sur ce dépôt PUBLIC.
# Objectif (Rodolphe, 2026-11-02): aucun secret, aucun mot de passe, aucune donnée
# personnelle ou compromettante ne doit atterrir sur GitHub.
name: secrets-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Motifs de secrets (arbre courant + historique complet)
        run: |
          set -uo pipefail
          PATTERNS='ghp_[A-Za-z0-9]{20}|github_pat_[A-Za-z0-9_]{20}|sk-[A-Za-z0-9]{20}|AKIA[A-Z0-9]{12}|xox[bp]-|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|-----.*PRIVATE KEY'
          echo "— scan arbre courant (git grep) —"
          if git grep -niE "$PATTERNS" -- . ; then
            echo "::error::Motif de secret détecté dans l'arbre courant"; exit 1
          fi
          echo "— scan historique complet (aucune sortie = propre) —"
          if git log --all -p --format= | grep -inE "$PATTERNS"; then
            echo "::error::Motif de secret détecté dans l'historique"; exit 1
          fi
          echo "— assignations suspectes de credentials (hors fichiers de test) —"
          if git grep -nEi "(password|passwd|secret|api_?key|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_+\-/=]{16,}['\"]" -- . ':(exclude)*test*' ':(exclude)*Test*' ':(exclude)*/fixtures/' | sed 's/:.*//' | sort -u | tee /tmp/matches.txt && [ -s /tmp/matches.txt ]; then
            echo "::error::Assignation suspecte — vérifier manuellement (fichiers ci-dessus)"; exit 1
          fi
          echo "OK: aucun secret détecté."

      - name: Fichiers sensibles jamais commités
        run: |
          set -uo pipefail
          echo "— .env / keystore / clés suivis par git —"
          if git ls-files | grep -inE '(^|/)\.env($|\.)|\.jks$|\.keystore$|id_rsa|\.pem$|credentials.*\.json$' ; then
            echo "::error::Fichier sensible suivi par git"; exit 1
          fi
          echo "OK: aucun fichier sensible suivi."